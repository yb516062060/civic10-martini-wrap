<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Martini Wrap Preview</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f2f2f2; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .sheet { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 18px; box-shadow: 0 3px 14px rgba(0,0,0,0.05); }
    h1 { margin: 0 0 12px; color: #0D2B67; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 20px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 10px; background: #fafafa; }
    .label { font-size: 12px; font-weight: bold; color: #0D2B67; margin-bottom: 8px; }
    .art { width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #ffffff 0%, #efefef 100%); }
    .art svg { width: 100%; height: 100%; }
    .note { margin-top: 18px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sheet">
      <h1>10th Gen Civic Sedan Martini Wrap Preview</h1>
      <div class="grid">
        <div class="card">
          <div class="label">Hood</div>
          <div class="art">
            <svg viewBox="0 0 1400 1200" xmlns="http://www.w3.org/2000/svg">
              <rect width="1400" height="1200" fill="#fff"/>
              <g>
                <rect x="340" y="200" width="180" height="520" fill="#0D2B67" rx="22"/>
                <rect x="520" y="200" width="220" height="520" fill="#5DA5D4" rx="22"/>
                <rect x="740" y="200" width="110" height="520" fill="#C8102E" rx="22"/>
                <rect x="850" y="200" width="220" height="520" fill="#5DA5D4" rx="22"/>
                <rect x="1070" y="200" width="180" height="520" fill="#0D2B67" rx="22"/>
              </g>
              <circle cx="700" cy="430" r="70" fill="#0D2B67" fill-opacity="0.9"/>
              <circle cx="700" cy="430" r="36" fill="#fff"/>
              <text x="700" y="450" text-anchor="middle" font-size="26" fill="#0D2B67" font-family="Arial">M</text>
            </svg>
          </div>
        </div>
        <div class="card">
          <div class="label">Left Side</div>
          <div class="art">
            <svg viewBox="0 0 3000 800" xmlns="http://www.w3.org/2000/svg">
              <rect width="3000" height="800" fill="#fff"/>
              <g>
                <rect x="200" y="160" width="430" height="420" fill="#0D2B67" rx="22"/>
                <rect x="630" y="160" width="500" height="420" fill="#5DA5D4" rx="22"/>
                <rect x="1130" y="160" width="190" height="420" fill="#C8102E" rx="22"/>
                <rect x="1320" y="160" width="500" height="420" fill="#5DA5D4" rx="22"/>
                <rect x="1820" y="160" width="430" height="420" fill="#0D2B67" rx="22"/>
              </g>
            </svg>
          </div>
        </div>
        <div class="card">
          <div class="label">Right Side</div>
          <div class="art">
            <svg viewBox="0 0 3000 800" xmlns="http://www.w3.org/2000/svg">
              <rect width="3000" height="800" fill="#fff"/>
              <g>
                <rect x="200" y="160" width="430" height="420" fill="#0D2B67" rx="22"/>
                <rect x="630" y="160" width="500" height="420" fill="#5DA5D4" rx="22"/>
                <rect x="1130" y="160" width="190" height="420" fill="#C8102E" rx="22"/>
                <rect x="1320" y="160" width="500" height="420" fill="#5DA5D4" rx="22"/>
                <rect x="1820" y="160" width="430" height="420" fill="#0D2B67" rx="22"/>
              </g>
            </svg>
          </div>
        </div>
        <div class="card">
          <div class="label">Trunk</div>
          <div class="art">
            <svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
              <rect width="1200" height="600" fill="#fff"/>
              <g>
                <rect x="230" y="170" width="160" height="260" fill="#0D2B67" rx="20"/>
                <rect x="390" y="170" width="180" height="260" fill="#5DA5D4" rx="20"/>
                <rect x="570" y="170" width="60" height="260" fill="#C8102E" rx="12"/>
                <rect x="630" y="170" width="180" height="260" fill="#5DA5D4" rx="20"/>
                <rect x="810" y="170" width="160" height="260" fill="#0D2B67" rx="20"/>
              </g>
              <circle cx="600" cy="295" r="58" fill="#0D2B67" fill-opacity="0.9"/>
              <circle cx="600" cy="295" r="28" fill="#fff"/>
              <text x="600" y="306" text-anchor="middle" font-size="22" fill="#0D2B67" font-family="Arial">M</text>
            </svg>
          </div>
        </div>
      </div>
      <div class="note">Martini-inspired concept preview for a 10th Gen Civic Sedan. Colors and placement are based on the agreed wrap layout.</div>
    </div>
  </div>
</body>
</html>
